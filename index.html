<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Трекер привычек — Октябрь 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="authView" class="auth">
      <h1>Трекер привычек</h1>
      <p>Войди, чтобы сохранять прогресс на всех устройствах.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
      <button id="loginBtn" class="primary">Войти</button>
      <button id="signupBtn" class="secondary">Создать аккаунт</button>
      <div id="authMsg" class="msg"></div>
    </section>

    <section id="trackerView" class="hidden">
      <header class="top">
        <div>
          <h1>Октябрь 2026</h1>
          <p>Тапни на день → отметь результат</p>
        </div>
        <button id="logoutBtn" class="logout">Выйти</button>
      </header>

      <div class="week">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div id="calendar" class="calendar"></div>

      <section class="day-panel">
        <h2 id="dayTitle">1 октября</h2>
        <p class="hint">Галочка означает, что цель за день выполнена</p>
        <div id="habits"></div>

        <div class="threads-card">
          <div class="habit-copy">
            <div class="habit-name">📱 Threads</div>
            <div class="habit-desc">Лимит: максимум 30 минут</div>
          </div>
          <div class="minutes-wrap">
            <input id="threadsMinutes" type="number" min="0" max="999" placeholder="МИН">
            <small id="threadsStatus">○ Не отмечено</small>
          </div>
        </div>

        <div class="summary">
          <span id="summaryText">0 из 7 целей выполнено.</span>
        </div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
