<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Трекер привычек</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="authView" class="auth"><h1>Трекер привычек</h1><p>Войди, чтобы сохранять прогресс.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn" class="primary">Войти</button><button id="signupBtn" class="secondary">Создать аккаунт</button><div id="authMsg" class="msg"></div></section>
<section id="trackerView" class="hidden"><header class="top"><div><h1>Октябрь 2026</h1><p>Тапни на день → отметь результат</p></div><div class="top-actions"><button id="settingsBtn" class="icon-btn">⚙️</button><button id="logoutBtn" class="logout">Выйти</button></div></header><div class="week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div id="calendar" class="calendar"></div><section class="day-panel"><h2 id="dayTitle"></h2><p class="hint">Галочка означает, что цель за день выполнена</p><div id="habits"></div><div class="threads-card"><div><div class="habit-name">📱 Threads</div><div class="habit-desc">Лимит: максимум 30 минут</div></div><div class="minutes-wrap"><input id="threadsMinutes" type="number" min="0" placeholder="МИН"><small id="threadsStatus">○ Не отмечено</small></div></div><div class="summary" id="summaryText"></div></section></section>
<section id="settingsView" class="hidden"><header class="top"><div><h1>Настройки целей</h1><p>Добавляй, меняй и удаляй свои цели</p></div><button id="backBtn" class="logout">Назад</button></header><div id="goalList" class="goal-list"></div><button id="addGoalBtn" class="primary full">＋ Добавить цель</button><div id="goalEditor" class="editor hidden"><h2 id="editorTitle">Новая цель</h2><input id="goalEmoji" maxlength="4" placeholder="Эмодзи"><input id="goalName" maxlength="60" placeholder="Название цели"><input id="goalDesc" maxlength="100" placeholder="Описание"><div class="editor-actions"><button id="cancelGoal" class="secondary">Отмена</button><button id="saveGoal" class="primary">Сохранить</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
